<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="stuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="stuFigure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d2e" />
      <stop offset="100%" stop-color="#24121e" />
    </linearGradient>
    <linearGradient id="stuAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="stuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <clipPath id="stuClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#stuBg)" />
  <circle cx="60" cy="60" r="56" fill="#fffdf5" opacity="0.9" />

  <!-- Themed Silhouette & Student Accents -->
  <g clip-path="url(#stuClip)">
    <!-- Gender-neutral Torso -->
    <path d="M22 112 C22 86, 38 74, 60 74 C82 74, 98 86, 98 112 Z" fill="url(#stuFigure)" />

    <!-- Backpack Straps in Warm Pink -->
    <path d="M37 82 L42 112" stroke="url(#stuAccent)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M83 82 L78 112" stroke="url(#stuAccent)" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Crew Neckline in Butter Yellow -->
    <path d="M52 74 Q60 83 68 74 Z" fill="url(#stuGold)" />

    <!-- Gender-neutral Head -->
    <circle cx="60" cy="48" r="18" fill="url(#stuFigure)" />

    <!-- Student Learning Sparkle / Star Badge at Top Right -->
    <path d="M86 28 Q90 30 92 34 Q94 30 98 28 Q94 26 92 22 Q90 26 86 28 Z" fill="url(#stuGold)" />
    <circle cx="82" cy="38" r="1.5" fill="url(#stuAccent)" />
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="56" stroke="url(#stuGold)" stroke-width="2" opacity="0.5" />
</svg>
